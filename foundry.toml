[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Pin the EVM target for reproducible builds and Avalanche compatibility.
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Scripts write local drafts and verified release records here.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[fmt]
# Keep deployed contract source byte-for-byte reproducible against explorer
# metadata. Format scripts and tests without rewriting the release source.
ignore = ["src/**"]

# CI uses a larger fuzz budget.
[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 1024

[rpc_endpoints]
avalanche_fuji = "https://api.avax-test.network/ext/bc/C/rpc"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
avalanche_fuji = { key = "verifyContract", chain = 43113, url = "https://api-testnet.snowtrace.io/api" }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
robinhood_testnet = { key = "", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
