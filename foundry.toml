[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Pinned, not defaulted: the compiler's default target moves with the toolchain, and a release
# whose bytecode changes when forge is upgraded cannot be reproduced from its source commit.
# Cancun is the newest target Base Sepolia (OP Stack) executes; solc emits no Prague-only
# opcodes, so this pins reproducibility without giving anything up.
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Deployment drafts and seed journals are written here by the scripts; the published manifest is
# produced afterwards by the post-receipt verifier (runbook 04 §4, artifacts 09 §1).
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

# Referenced by .github/workflows/test.yml (FOUNDRY_PROFILE: ci). Without this section Foundry
# silently fell back to the default profile.
[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 1024

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
